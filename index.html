<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stackdeck</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="16" y="44" width="34" height="10" rx="5" fill="%2357534b"/><rect x="11" y="29" width="34" height="10" rx="5" fill="%238a8375"/><rect x="6" y="14" width="34" height="10" rx="5" fill="%23dfa662"/><circle cx="48" cy="19" r="4.5" fill="%235ec488"/><circle cx="48" cy="19" r="7.5" fill="%235ec488" opacity="0.25"/></svg>'>
<style>
  :root {
    --bg:        oklch(0.145 0.008 75);
    --surface:   oklch(0.18 0.009 75);
    --surface-2: oklch(0.215 0.011 75);
    --border:    oklch(0.27 0.012 75);
    --hairline:  oklch(0.23 0.010 75);
    --text:      oklch(0.93 0.010 85);
    --dim:       oklch(0.66 0.014 80);
    --faint:     oklch(0.47 0.012 80);
    --accent:    oklch(0.78 0.115 68);
    --accent-dim:oklch(0.78 0.115 68 / .14);
    --green:     oklch(0.74 0.145 152);
    --green-dim: oklch(0.74 0.145 152 / .13);
    --red:       oklch(0.66 0.17 26);
    --red-dim:   oklch(0.66 0.17 26 / .13);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 var(--sans); }

  header {
    display:flex; align-items:baseline; gap:14px;
    padding:22px 28px 0; max-width:1000px; margin:0 auto;
  }
  header h1 { font-size:16px; font-weight:650; margin:0; letter-spacing:.01em; }
  header h1 span { color:var(--accent); }
  #summary { color:var(--dim); font-size:12.5px; }
  header .spacer { flex:1; }
  header .paths { color:var(--faint); font-size:11px; font-family:var(--mono); }

  main { max-width:1000px; margin:0 auto; padding:10px 28px 96px; }

  .section-label {
    margin:36px 2px 10px; font-size:11px; font-weight:600; letter-spacing:.1em;
    text-transform:uppercase; color:var(--faint);
    display:flex; align-items:center; gap:10px;
  }
  .section-label .count { color:var(--dim); font-weight:500; letter-spacing:0; text-transform:none; }
  .section-label button { font-size:11.5px; padding:3px 9px; }
  .section-label input {
    margin-left:auto; width:220px; font-size:12.5px; letter-spacing:0; text-transform:none; font-weight:400;
  }

  .ledger { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }

  .row { border-top:1px solid var(--hairline); transition:background .15s ease-out; }
  .row:first-child { border-top:none; }
  .row:hover { background:var(--surface-2); }
  .row-main { display:flex; align-items:center; gap:12px; padding:11px 16px; }

  /* hollow = stopped, filled+halo = running */
  .dot { width:8px; height:8px; border-radius:50%; background:transparent;
         border:1.5px solid var(--faint); flex:none; }
  .dot.up { background:var(--green); border-color:var(--green); box-shadow:0 0 0 3px var(--green-dim); }

  .svc-name { font-weight:600; font-size:13.5px; min-width:96px; }
  .addr { font-family:var(--mono); font-size:12px; color:var(--dim); white-space:nowrap; }
  .grow { flex:1; min-width:0; }
  .cmdline {
    font-family:var(--mono); font-size:11.5px; color:var(--faint);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cmdline b { color:var(--dim); font-weight:500; }

  .badge {
    font-size:10.5px; font-weight:600; letter-spacing:.03em; padding:2px 7px;
    border-radius:5px; white-space:nowrap;
  }
  .badge.ext   { color:var(--accent); background:var(--accent-dim); }
  .badge.dirty { color:var(--accent); background:var(--accent-dim); }
  .badge.git   { color:var(--dim); background:oklch(0.30 0.012 75 / .5); font-family:var(--mono); font-weight:500; max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .badge.plain { color:var(--faint); background:oklch(0.30 0.012 75 / .35); }
  .badge.cfgd  { color:var(--green); background:var(--green-dim); }
  .badge.crash { color:var(--red); background:var(--red-dim); }
  a.badge.link { color:var(--accent); background:var(--accent-dim); text-decoration:none; }
  a.badge.link:hover { text-decoration:underline; }
  .logfilter { width:200px; margin:0 0 6px; font-size:11.5px; padding:3px 8px; }

  select, input, textarea {
    background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:7px;
    padding:5px 9px; font-family:var(--mono); font-size:12px;
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline:2px solid var(--accent); outline-offset:1px;
  }
  select:disabled { opacity:.4; cursor:not-allowed; }

  /* fixed-width slots keep every row's controls in the same columns */
  .branch-slot { width:220px; flex:none; display:flex; justify-content:flex-end; }
  .branch-slot select { width:100%; }
  .branch-slot select.dirty { border-color:var(--accent); }
  .row-actions { display:flex; gap:2px; flex:none; align-items:center; }
  .row-actions .primary { width:74px; text-align:center; }
  .addr { width:110px; flex:none; text-align:right; }

  /* Secondary actions stay quiet until the row (or section head) is engaged —
     the board reads as status, not as a wall of buttons. */
  .row-actions .ghost, .group-head .actions button, .row .add {
    opacity:0; transition:opacity .15s ease-out;
  }
  .row:hover .row-actions .ghost, .row:focus-within .row-actions .ghost,
  .group-head:hover .actions button, .group-head:focus-within .actions button,
  .row:hover .add, .row:focus-within .add { opacity:1; }

  /* touch devices have no hover — keep actions visible there */
  @media (hover: none) {
    .row-actions .ghost, .group-head .actions button, .row .add { opacity:1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition:none !important; animation:none !important; }
  }
  textarea { width:100%; resize:vertical; min-height:34px; }

  button {
    font:600 12.5px var(--sans); color:var(--text);
    background:var(--surface-2); border:1px solid var(--border); border-radius:7px;
    padding:5px 13px; cursor:pointer;
    transition:border-color .15s ease-out, background .15s ease-out, color .15s ease-out;
  }
  button:hover { border-color:var(--dim); }
  button:active { transform:translateY(0.5px); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.start { color:var(--green); background:var(--green-dim); border-color:transparent; }
  button.start:hover { background:var(--green); color:oklch(0.15 0.02 152); }
  button.kill { color:var(--red); background:var(--red-dim); border-color:transparent; }
  button.kill:hover { background:var(--red); color:oklch(0.97 0.01 26); }
  button.ghost { background:transparent; border-color:transparent; color:var(--dim); font-weight:500; }
  button.ghost:hover { color:var(--text); border-color:var(--border); }
  button.add { color:var(--accent); background:var(--accent-dim); border-color:transparent; }
  button.add:hover { background:var(--accent); color:oklch(0.16 0.02 68); }

  .drawer { display:none; padding:4px 16px 14px 36px; }
  .drawer.open { display:block; }
  .fields { display:grid; grid-template-columns:64px 1fr; gap:7px 12px; align-items:center; max-width:720px; }
  .fields label { color:var(--faint); font-size:11.5px; text-align:right; }

  .logs {
    background:oklch(0.10 0.006 75); border:1px solid var(--hairline); border-radius:8px;
    padding:10px 12px; height:250px; overflow:auto; overscroll-behavior:contain;
    font-family:var(--mono); font-size:11.5px; line-height:1.55; white-space:pre-wrap; color:var(--dim);
  }
  .logs:empty::before { content:"waiting for output…"; color:var(--faint); font-style:italic; }
  .logs::-webkit-scrollbar { width:8px; }
  .logs::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
  .logs::-webkit-scrollbar-track { background:transparent; }

  .empty { padding:26px 16px; text-align:center; color:var(--faint); font-size:12.5px; }

  /* drag & drop */
  .handle {
    color:var(--faint); cursor:grab; font-size:13px; letter-spacing:-1px;
    padding:2px 2px 2px 0; user-select:none; flex:none;
  }
  .handle:hover { color:var(--dim); }
  .row.dragging { opacity:.35; }
  .row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .ledger.drop-into { border-color:var(--accent); background:var(--accent-dim); }
  .group-block { margin-bottom:18px; }
  .group-head {
    display:flex; align-items:center; gap:8px; margin:0 2px 6px;
    font-size:11.5px; font-weight:600; color:var(--dim); letter-spacing:.04em;
  }
  .group-head .count { color:var(--faint); font-weight:500; }
  .group-head button { padding:1px 7px; font-size:11px; }
  .group-head .actions { margin-left:auto; display:flex; gap:4px; }
  .hiddenItem { opacity:.45; }
  .group-head .title { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  .group-head .title:hover { color:var(--text); }
  .chev { display:inline-block; transition:transform .15s ease-out; font-size:10px; color:var(--faint); }
  .chev.closed { transform:rotate(-90deg); }

  /* settings: folder tree */
  .cfg-label { font-size:11.5px; font-weight:600; color:var(--dim); letter-spacing:.04em; margin:2px 0 8px; }
  .cfg-label .count { color:var(--faint); font-weight:500; }
  .root-row {
    display:flex; align-items:center; gap:10px; padding:6px 0;
    font-family:var(--mono); font-size:12.5px;
  }
  .root-row .chev { cursor:pointer; padding:4px; }
  .child-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:2px 14px; padding:6px 0 12px 24px;
  }
  .child-grid label {
    display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12px;
    color:var(--text); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .child-grid label.off { color:var(--faint); text-decoration:line-through; }
  .child-grid input { accent-color:var(--accent); }
  .browser {
    border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin:8px 0;
    max-width:560px; background:var(--bg);
  }
  .browser .crumb { font-family:var(--mono); font-size:12px; color:var(--dim); margin-bottom:8px; word-break:break-all; }
  .browser .dirs { max-height:220px; overflow:auto; display:grid; gap:1px; }
  .browser .dirs button {
    text-align:left; background:transparent; border-color:transparent; color:var(--text);
    font:500 12.5px var(--mono); padding:3px 8px;
  }
  .browser .dirs button:hover { background:var(--surface-2); }
  .cat-list { display:grid; gap:2px; max-width:380px; }
  .cat-row {
    display:flex; align-items:center; gap:9px; padding:5px 10px;
    border:1px solid var(--hairline); border-radius:7px; background:var(--bg);
    font-size:12.5px; cursor:grab; user-select:none;
  }
  .cat-row .count { color:var(--faint); margin-left:auto; font-size:11.5px; }
  .cat-row.dragging { opacity:.35; }
  .cat-row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .cat-row.pinned { color:var(--faint); cursor:default; border-style:dashed; }

  .toast {
    position:fixed; bottom:22px; left:50%; transform:translate(-50%, 8px);
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:10px 18px; max-width:70%; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s ease-out, transform .2s ease-out;
  }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  .toast.err { border-color:var(--red); color:oklch(0.85 0.06 26); }
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 64 64" width="18" height="18" style="vertical-align:-3px; margin-right:2px" aria-hidden="true"><rect x="16" y="44" width="34" height="10" rx="5" fill="#57534b"/><rect x="11" y="29" width="34" height="10" rx="5" fill="#8a8375"/><rect x="6" y="14" width="34" height="10" rx="5" fill="#dfa662"/><circle cx="48" cy="19" r="4.5" fill="#5ec488"/><circle cx="48" cy="19" r="7.5" fill="#5ec488" opacity="0.25"/></svg> stack<span>deck</span></h1>
  <span id="summary"></span>
  <span class="spacer"></span>
  <button class="ghost" id="hiddenToggle" onclick="toggleHidden()" title="show/hide the items you've hidden"></button>
  <button class="ghost" onclick="toggleSettings()">settings</button>
  <span class="paths" id="metaPaths"></span>
</header>
<main>
  <div class="ledger" id="settings" style="display:none; margin-top:18px">
    <div class="drawer open" style="padding:16px 18px">
      <div class="cfg-label">Scanned folders <span class="count">tick a subfolder to include it, untick to exclude</span></div>
      <div id="cfg-roots-list"></div>
      <div id="cfg-browser" style="display:none"></div>
      <button class="ghost" onclick="browseFolders()">+ add folder…</button>
      <div class="cfg-label" style="margin-top:16px">Project categories <span class="count">drag to change the order they appear on the board</span></div>
      <div id="cfg-cats" class="cat-list"></div>
      <div style="display:flex; gap:10px; align-items:center; margin-top:12px">
        <button onclick="saveConfig()">Save</button>
        <span class="cmdline" id="cfg-path"></span>
      </div>
    </div>
  </div>
  <div class="section-label">Services <span class="count" id="svc-count"></span>
    <span style="margin-left:auto; display:flex; gap:4px">
      <button class="ghost" onclick="collapseAll('g', true)">collapse all</button>
      <button class="ghost" onclick="collapseAll('g', false)">expand all</button>
      <button class="ghost" onclick="addSection()">+ section</button>
    </span>
  </div>
  <div id="services"></div>

  <div class="section-label">Dev tools <span class="count" id="infra-count"></span></div>
  <div class="ledger" id="infra"></div>

  <div class="section-label">
    Projects <span class="count" id="proj-count"></span>
    <span style="margin-left:auto; display:flex; gap:4px; align-items:center">
      <button class="ghost" onclick="addCategory()">+ category</button>
      <button class="ghost" onclick="refreshProjects()" title="rescan project roots for new folders">↻ refresh</button>
      <button class="ghost" onclick="collapseAll('c', true)">collapse all</button>
      <button class="ghost" onclick="collapseAll('c', false)">expand all</button>
      <input id="filter" type="search" placeholder="filter projects…" oninput="renderProjects()">
    </span>
  </div>
  <div id="projects"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const TOKEN = "__STACKDECK_TOKEN__"; // injected by the daemon when serving this page
const $svc = document.getElementById("services");
const $proj = document.getElementById("projects");
const $toast = document.getElementById("toast");
const open = new Set(), logOpen = new Set(), streams = Object.create(null);
let services = [], projects = [], groups = [], instancesList = [];
let hiddenGroups = [], hiddenCategories = [], showHidden = false;

/* collapse state: keys "g:<group>" (services) and "c:<category>" (projects) */
const collapsed = new Set(JSON.parse(localStorage.getItem("stackdeck.collapsed") || "[]"));
function saveCollapsed() { localStorage.setItem("stackdeck.collapsed", JSON.stringify([...collapsed])); }
function toggleCollapse(key) {
  collapsed.has(key) ? collapsed.delete(key) : collapsed.add(key);
  saveCollapsed();
  key.startsWith("g:") ? renderServices() : renderProjects();
}
function collapseAll(prefix, on) {
  const keys = prefix === "g"
    ? (groups.length ? [...groups, ""] : [""]).map(g => "g:" + g)
    : [...new Set(projects.map(p => p.category || "Uncategorized"))].map(c => "c:" + c);
  for (const k of keys) on ? collapsed.add(k) : collapsed.delete(k);
  saveCollapsed();
  prefix === "g" ? renderServices() : renderProjects();
}
function chevTitle(key, label, count) {
  return `<span class="title" onclick="toggleCollapse(decodeURIComponent('${encodeURIComponent(key)}'))">
    <span class="chev ${collapsed.has(key) ? "closed" : ""}">▾</span>${label}
    <span class="count">${count}</span></span>`;
}

function toggleHidden() { showHidden = !showHidden; renderServices(); renderProjects(); updateHiddenToggle(); }
function updateHiddenToggle() {
  const n = services.filter(s => s.hidden).length + hiddenGroups.length + hiddenCategories.length;
  const el = document.getElementById("hiddenToggle");
  el.textContent = showHidden ? "hide hidden" : `hidden (${n})`;
  el.style.display = n ? "" : "none";
}
async function hideItem(type, name, hidden) {
  try { await api("/api/hide", { type, name, hidden }); }
  catch (e) { toast(e.message, true); }
  loadServices(true); renderProjects();
}

async function startAll(group) {
  toast("starting section (dependency order)…");
  try {
    const { results } = await api("/api/start-all", { group });
    const started = Object.values(results).filter(v => v.started).length;
    const failed = Object.entries(results).filter(([, v]) => v.error);
    toast(failed.length
      ? `started ${started}; failed: ${failed.map(([n, v]) => `${n} (${v.error})`).join("; ")}`
      : `started ${started}${Object.values(results).some(v => v.alreadyRunning) ? " (rest already up)" : ""}`,
      failed.length > 0);
  } catch (e) { toast(e.message, true); }
  loadServices(true);
}
async function stopAll(group) {
  const targets = services.filter(s => (s.group || null) === group && s.running);
  if (!targets.length) return toast("nothing to stop");
  const r = await Promise.allSettled(targets.map(s => api("/api/stop", { name: s.name })));
  const ok = r.filter(x => x.status === "fulfilled").length;
  const notes = r.filter(x => x.status === "fulfilled" && x.value.note).map(x => x.value.note);
  const errs = r.filter(x => x.status === "rejected").map(x => x.reason.message);
  toast([`stopped ${ok}/${targets.length}`, ...notes, ...errs].join(" · "), notes.length + errs.length > 0);
  setTimeout(() => loadServices(true), 500);
}

function toast(msg, err) {
  $toast.textContent = msg;
  $toast.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => ($toast.className = "toast"), 4200);
}

async function api(path, body) {
  const headers = { "X-Stackdeck-Token": TOKEN };
  if (body) headers["Content-Type"] = "application/json";
  const r = await fetch(path, body ? { method:"POST", headers, body: JSON.stringify(body) } : { headers });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
// HTML/attribute escaping. NOTE: this is NOT protection inside inline
// onclick handlers (the HTML parser decodes entities before JS parses) —
// there, safety comes from server-side name validation ([A-Za-z0-9._-] only)
// or the encodeURIComponent/decodeURIComponent pattern used for free text.
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// Shorten a path with the real home dir from /api/meta (never a guessed prefix).
function shortP(p){ return meta && meta.home && p.startsWith(meta.home) ? "~" + p.slice(meta.home.length) : p; }
const shortDir = shortP;

/* ---------- services ---------- */

function svcRow(s) {
  // Dirty (uncommitted changes) shows as an amber outline on the dropdown —
  // a badge would shift the columns.
  const selTitle = s.running
    ? `on ${s.branch} — Kill first to switch the main checkout, or ⧉ to run the selected branch in a parallel worktree${s.dirty ? " · uncommitted changes" : ""}`
    : (s.dirty ? "uncommitted changes — commit or stash to switch branch" : "branch to run (⧉ runs it in a parallel worktree)");
  const branch = `<span class="branch-slot">${s.isGit
    ? `<select id="br-${s.name}" class="${s.dirty ? "dirty" : ""}" title="${esc(selTitle)}">
         ${s.branches.map(b => `<option ${b===s.branch?"selected":""}>${esc(b)}</option>`).join("")}
       </select>
       <button class="ghost" style="padding:3px 7px" title="run the selected branch in a parallel worktree (own checkout, auto $PORT)"
               onclick="worktreeStart('${esc(s.name)}')">⧉</button>`
    : '<span class="badge plain">no git</span>'}</span>`;
  return `
  <div class="row ${s.hidden ? "hiddenItem" : ""}" data-name="${esc(s.name)}"
       ondragover="rowOver(event)" ondragleave="rowLeave(event)" ondrop="rowDrop(event)">
    <div class="row-main">
      <span class="handle" draggable="true" title="drag to reorder or move to a section"
            ondragstart="dragStart(event,'${esc(s.name)}')" ondragend="dragEnd()">⠿</span>
      <span class="dot ${s.running ? "up" : ""}"></span>
      <span class="svc-name">${esc(s.name)}</span>
      ${s.resurrected
        ? '<span class="badge crash" title="Stackdeck killed it, but a supervisor (brew services / launchd / systemd) restarted it — stop it with its own manager, e.g. brew services stop">auto-restarted</span>'
        : s.running && !s.managed ? '<span class="badge ext" title="running, but not started from Stackdeck">external</span>' : ""}
      ${s.restartPending ? '<span class="badge dirty" title="crashed; auto-restart scheduled">restarting…</span>' : ""}
      ${!s.running && !s.restartPending && s.lastExit && !s.lastExit.expected && s.lastExit.code !== 0
        ? `<span class="badge crash" title="exited with code ${s.lastExit.code}">crashed</span>` : ""}
      ${meta && meta.proxyPort && s.port
        ? `<a class="badge link" target="_blank" href="http://${esc(s.name)}.localhost${meta.proxyPort === 80 ? "" : ":" + meta.proxyPort}"
             title="via the *.localhost proxy">${esc(s.name)}.localhost</a>` : ""}
      <span class="addr">:${s.port ?? "—"}${s.pid ? " · " + s.pid : ""}</span>
      <span class="grow cmdline" title="${esc(s.dir)}">${esc(shortDir(s.dir))} · <b>${esc(s.command)}</b></span>
      ${branch}
      <span class="row-actions">
        ${s.running
          ? `<button class="kill primary" onclick="stop('${s.name}')">Kill</button>`
          : `<button class="start primary" onclick="start('${s.name}')">Start</button>`}
        <button class="ghost" ${s.running ? "" : "disabled"} title="stop, then start again on the same branch"
                onclick="restart('${s.name}')">restart</button>

        <button class="ghost" onclick="toggleEdit('${s.name}')">edit</button>
        <button class="ghost" title="${s.hidden ? "show on board" : "hide from board"}"
                onclick="hideItem('service','${esc(s.name)}',${!s.hidden})">${s.hidden ? "unhide" : "hide"}</button>
      </span>
    </div>
    <div class="drawer ${open.has(s.name) ? "open" : ""}" id="edit-${s.name}">
      <div class="fields">
        <label>name</label><input id="name-${s.name}" value="${esc(s.name)}">
        <label>dir</label><input id="dir-${s.name}" value="${esc(s.dir)}">
        <label>command</label><textarea id="cmd-${s.name}">${esc(s.command)}</textarea>
        <label>port</label><input id="port-${s.name}" value="${s.port ?? ""}" placeholder="for status detection">
        <label>env</label><textarea id="env-${s.name}" placeholder='{"KEY":"value"} — .env in dir loads automatically; these override it'>${esc(JSON.stringify(s.env || {}))}</textarea>
        <label>restart</label>
        <select id="rs-${s.name}" style="max-width:160px">
          <option value="">never (default)</option>
          <option value="on-failure" ${s.restart === "on-failure" ? "selected" : ""}>on failure (backoff, 5 tries)</option>
        </select>
        <label>depends on</label><input id="dep-${s.name}" value="${esc((s.dependsOn || []).join(", "))}" placeholder="comma-separated service names, started first">
        <label>ready when</label><input id="rw-${s.name}" value="${esc((s.readyWhen && s.readyWhen.log) || "")}" placeholder="regex matched against its logs (default: port opens)">
        <label></label>
        <div style="display:flex; gap:8px">
          <button onclick="saveSvc('${s.name}')">Save</button>
          <button class="ghost" onclick="delSvc('${s.name}')">remove</button>
        </div>
      </div>
    </div>
    <div class="drawer ${logOpen.has(s.name) ? "open" : ""}" id="logwrap-${s.name}">
      <input class="logfilter" id="lf-${s.name}" type="search" placeholder="filter logs…" oninput="filterLogs('${s.name}')">
      <div class="logs" id="log-${s.name}"></div>
    </div>
  </div>`;
}


function renderServices() {
  const up = services.filter(s => s.running).length;
  document.getElementById("svc-count").textContent = `${up} running · ${services.length - up} stopped`;
  document.getElementById("summary").textContent = up ? `${up} service${up>1?"s":""} up` : "all quiet";
  if (!services.length) {
    $svc.innerHTML = '<div class="ledger"><div class="empty">No services yet. Configure one from the Projects list below.</div></div>';
    return;
  }
  const sections = groups.length ? [...groups, null] : [null];
  $svc.innerHTML = sections.map(g => {
    const gHidden = g !== null && hiddenGroups.includes(g);
    if (gHidden && !showHidden) return "";
    const rows = services.filter(s => (s.group || null) === g && (showHidden || !s.hidden));
    if (g === null && groups.length && !rows.length) return "";
    const gArg = g === null ? "null" : `decodeURIComponent('${encodeURIComponent(g)}')`;
    const key = "g:" + (g ?? "");
    const isClosed = collapsed.has(key);
    const running = rows.filter(r => r.running).length;
    const bulk = `<span class="actions">
      <button class="ghost" onclick="startAll(${gArg})" title="start every stopped service here">start all</button>
      <button class="ghost" onclick="stopAll(${gArg})" title="stop every running service here">stop all</button>`;
    const head = g !== null
      ? `<div class="group-head">${chevTitle(key, esc(g), `${running}/${rows.length} up`)}${bulk}
           <button class="ghost" onclick="renameSection(${gArg})">rename</button>
           <button class="ghost" onclick="hideItem('group',${gArg},${!gHidden})">${gHidden ? "unhide" : "hide"}</button>
           <button class="ghost" aria-label="delete section" title="delete section (services move to Ungrouped)" onclick="delSection(${gArg})">×</button></span></div>`
      : (groups.length ? `<div class="group-head">${chevTitle(key, "Ungrouped", `${running}/${rows.length} up`)}${bulk}</span></div>` : "");
    const rowHtml = (s) => svcRow(s) + instancesList.filter(i => i.svc === s.name).map(instanceRow).join("");
    const ledger = isClosed && head ? "" : `
      <div class="ledger" data-group="${g === null ? "" : esc(g)}"
           ondragover="ledgerOver(event)" ondragleave="ledgerLeave(event)" ondrop="ledgerDrop(event)">
        ${rows.length ? rows.map(rowHtml).join("") : '<div class="empty">drop services here</div>'}
      </div>`;
    return `<div class="group-block ${gHidden ? "hiddenItem" : ""}">${head}${ledger}</div>`;
  }).join("");
  for (const n of logOpen) attachStream(n);
  updateHiddenToggle();
}

/* ---------- drag & drop ---------- */

let dragging = null;

function dragStart(ev, name) {
  dragging = name;
  ev.dataTransfer.effectAllowed = "move";
  ev.dataTransfer.setData("text/plain", name);
  const row = ev.target.closest(".row");
  ev.dataTransfer.setDragImage(row, 20, 20);
  setTimeout(() => row.classList.add("dragging"), 0);
}
function dragEnd() {
  dragging = null;
  document.querySelectorAll(".dragging,.drop-before,.drop-into")
    .forEach(el => el.classList.remove("dragging","drop-before","drop-into"));
}
function rowOver(ev) {
  if (!dragging) return;
  ev.preventDefault(); ev.stopPropagation();
  ev.dataTransfer.dropEffect = "move";
  const row = ev.currentTarget;
  if (row.dataset.name !== dragging) row.classList.add("drop-before");
}
function rowLeave(ev) { ev.currentTarget.classList.remove("drop-before"); }
async function rowDrop(ev) {
  ev.preventDefault(); ev.stopPropagation();
  const row = ev.currentTarget;
  row.classList.remove("drop-before");
  const before = row.dataset.name;
  const group = row.closest(".ledger").dataset.group || null;
  if (!dragging || before === dragging) return dragEnd();
  await move(dragging, group, before);
}
function ledgerOver(ev) {
  if (!dragging) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  ev.currentTarget.classList.add("drop-into");
}
function ledgerLeave(ev) { ev.currentTarget.classList.remove("drop-into"); }
async function ledgerDrop(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.remove("drop-into");
  const group = ev.currentTarget.dataset.group || null;
  if (!dragging) return;
  await move(dragging, group, null); // append at end of section
}
async function move(name, group, before) {
  const n = name; dragEnd();
  try { await api("/api/move", { name: n, group, before }); }
  catch (e) { toast(e.message, true); }
  loadServices(true);
}

let CAT_ORDER = ["Uncategorized"]; // overridden by config.categoryOrder via /api/meta

function renderProjects() {
  const q = document.getElementById("filter").value.toLowerCase();
  const shown = projects.filter(p => !q || p.name.toLowerCase().includes(q) ||
                                     (p.category || "").toLowerCase().includes(q));
  document.getElementById("proj-count").textContent =
    `${projects.length} projects · ${projects.filter(p=>p.isGit).length} git`;
  if (q && !shown.length) { $proj.innerHTML = '<div class="ledger"><div class="empty">Nothing matches.</div></div>'; return; }
  // Your categories (in your order) — shown even when empty, so you can drag
  // into a fresh one — then any others found in data, then Uncategorized.
  const fromData = [...new Set(shown.map(p => p.category || "Uncategorized"))];
  const cats = [
    ...CAT_ORDER.filter(c => c !== "Uncategorized"),
    ...fromData.filter(c => c !== "Uncategorized" && !CAT_ORDER.includes(c)).sort(),
    "Uncategorized",
  ];
  $proj.innerHTML = cats.map(c => {
    const cHidden = hiddenCategories.includes(c);
    if (cHidden && !showHidden) return "";
    const rows = shown.filter(p => (p.category || "Uncategorized") === c);
    if (q && !rows.length) return ""; // filtering: only categories with matches
    const cArg = `decodeURIComponent('${encodeURIComponent(c)}')`;
    const key = "c:" + c;
    const isClosed = collapsed.has(key) && !q; // an active filter always shows its matches
    const isUncat = c === "Uncategorized";
    return `<div class="group-block ${cHidden ? "hiddenItem" : ""}">
      <div class="group-head">${chevTitle(key, esc(c), rows.length)}
        <span class="actions">
          ${isUncat ? "" : `<button class="ghost" onclick="hideItem('category',${cArg},${!cHidden})">${cHidden ? "unhide" : "hide"}</button>
          <button class="ghost" aria-label="delete category" title="delete category (projects move to Uncategorized)" onclick="delCategory(${cArg})">×</button>`}
        </span>
      </div>
      ${isClosed ? "" : `<div class="ledger" data-cat="${isUncat ? "" : esc(c)}"
           ondragover="catOver(event)" ondragleave="catLeave(event)" ondrop="catDrop(event)">
        ${rows.length ? rows.map(projRow).join("") : '<div class="empty">drag projects here</div>'}
      </div>`}
    </div>`;
  }).join("");
  updateHiddenToggle();
}

async function configure(name) {
  const p = projects.find(x => x.name === name);
  if (!p) return;
  const base = name.split("/").pop().toLowerCase().replace(/[^a-z0-9_-]+/g, "-");
  try {
    // Multi-process repo (Procfile / compose services / pnpm workspace):
    // one service per process, grouped into a section named after the repo.
    if (p.procs && p.procs.length) {
      const section = name.split("/").pop().slice(0, 64);
      await api("/api/group", { name: section }).catch(() => {}); // may already exist
      let created = 0;
      for (const proc of p.procs) {
        const svcName = `${base}-${proc.name}`.toLowerCase().replace(/[^a-z0-9._-]+/g, "-").slice(0, 64);
        if (services.some(s => s.name === svcName)) continue;
        await api("/api/service", { name: svcName, dir: proc.dir, command: proc.command, group: section });
        created++;
      }
      toast(`created ${created} services in section '${section}'`);
      await load();
      return;
    }
    let svcName = base;
    if (services.some(s => s.name === svcName)) svcName += "-2";
    await api("/api/service", { name: svcName, dir: p.dir, command: p.suggestedCommand || "echo set a command" });
    toast(`${svcName} added to Services${p.suggestedCommand ? "" : " — set its command"}`);
    open.add(svcName);
    await load();
    document.getElementById("edit-" + svcName)?.scrollIntoView({ block:"center", behavior:"smooth" });
  } catch (e) { toast(e.message, true); }
}

async function start(name, force) {
  const sel = document.getElementById("br-" + name);
  try {
    const s = services.find(x => x.name === name);
    // when stopped, the dropdown choice is a checkout request; when it was
    // running the select stays enabled for worktrees only
    await api("/api/start", { name, branch: sel && s && !s.running ? sel.value : undefined, force: !!force });
    toast(name + " started");

  } catch (e) {
    const busy = e.message.match(/port (\d+) is busy \(pid (\d+)/);
    if (busy && !force && confirm(`Port ${busy[1]} is used by another process (pid ${busy[2]}).\nKill it and start ${name}?`))
      return start(name, true);
    toast(e.message, true);

  loadServices(true);
}

  else logOpen.add(name);

/* Minimal ANSI SGR → HTML (colors 30–37/90–97, bold, dim, reset). */
const ANSI_FG = { 30:"#57534c",31:"#e06c5f",32:"#84c17b",33:"#d9a05b",34:"#7aa2d4",35:"#c092d0",36:"#72bcb8",37:"#b8b2a7",
                  90:"#6e6a63",91:"#f08d80",92:"#a0d598",93:"#e8bc7e",94:"#9dbfe6",95:"#d5b0e2",96:"#93d5d1",97:"#d6d0c4" };
function ansiToHtml(raw) {
  let out = "", openSpan = false;
  for (const part of raw.split(/(\x1b\[[0-9;]*m)/)) {
    const m = part.match(/^\x1b\[([0-9;]*)m$/);
    if (!m) { out += esc(part); continue; }
    if (openSpan) { out += "</span>"; openSpan = false; }
    const codes = m[1].split(";").filter(Boolean).map(Number);
    const styles = [];
    for (const c of codes) {
      if (ANSI_FG[c]) styles.push("color:" + ANSI_FG[c]);
      else if (c === 1) styles.push("font-weight:600");
      else if (c === 2) styles.push("opacity:.6");
    }
    if (styles.length) { out += `<span style="${styles.join(";")}">`; openSpan = true; }
  }
  return out + (openSpan ? "</span>" : "");
}

const clientLogs = Object.create(null); // name -> [raw lines], powers the per-pane filter
function logMatches(name, line) {
  const q = (document.getElementById("lf-" + name)?.value || "").toLowerCase();
  return !q || line.toLowerCase().includes(q);
}
function filterLogs(name) {
  const pane = document.getElementById("log-" + name);
  if (!pane) return;
  pane.innerHTML = (clientLogs[name] || [])
    .filter(l => logMatches(name, l))
    .map(l => ansiToHtml(l) + "\n").join("");
  pane.scrollTop = pane.scrollHeight;
}
function attachStream(name) {
  streams[name]?.close();
  const pane = document.getElementById("log-" + name);
  if (!pane) return;
  pane.innerHTML = "";
  clientLogs[name] = [];
  const es = new EventSource("/api/logs?name=" + encodeURIComponent(name) + "&t=" + TOKEN);
  es.onmessage = (ev) => {
    const line = JSON.parse(ev.data);
    const buf = clientLogs[name];
    buf.push(line);
    if (buf.length > 3000) buf.shift();
    if (!logMatches(name, line)) return;
    pane.insertAdjacentHTML("beforeend", ansiToHtml(line) + "\n");
    while (pane.childNodes.length > 6000) pane.removeChild(pane.firstChild);
    pane.scrollTop = pane.scrollHeight;
  };
  streams[name] = es;
}
async function saveSvc(name) {
  let env;
  try { env = JSON.parse(document.getElementById("env-" + name).value || "{}"); }
  catch { return toast("env must be valid JSON", true); }
  try {
    let finalName = name;
    const wanted = document.getElementById("name-" + name).value.trim();
    if (wanted && wanted !== name) {
      await api("/api/service/rename", { name, newName: wanted });
      if (logOpen.has(name)) { logOpen.delete(name); logOpen.add(wanted); streams[name]?.close(); delete streams[name]; }
      finalName = wanted;
    }
    const cur = services.find(x => x.name === name) || {};
    const rw = document.getElementById("rw-" + name).value.trim();
    const body = {
      name: finalName,
      dir: document.getElementById("dir-" + name).value.trim(),
      command: document.getElementById("cmd-" + name).value.trim(),
      port: document.getElementById("port-" + name).value.trim() || undefined,
      env,
      restart: document.getElementById("rs-" + name).value || null,
      dependsOn: document.getElementById("dep-" + name).value.split(",").map(x => x.trim()).filter(Boolean),
      readyWhen: rw ? { log: rw } : null,
    };
    // Rename works mid-run; the other fields need a stopped service. Skip the
    // field save when nothing but the name changed, so renaming while running
    // doesn't half-fail.
    const fieldsChanged = body.dir !== cur.dir || body.command !== cur.command ||
      String(body.port ?? "") !== String(cur.port ?? "") || JSON.stringify(env) !== JSON.stringify(cur.env || {}) ||
      (body.restart || "") !== (cur.restart || "") ||
      JSON.stringify(body.dependsOn) !== JSON.stringify(cur.dependsOn || []) ||
      rw !== ((cur.readyWhen && cur.readyWhen.log) || "");
    if (fieldsChanged) await api("/api/service", body);
    toast(finalName + " saved"); open.delete(name); load();
  } catch (e) { toast(e.message, true); }
}
async function delSvc(name) {
  if (!confirm("Remove '" + name + "' from Stackdeck? (the project itself is untouched)")) return;
  try { await api("/api/service/delete", { name }); toast(name + " removed"); load(); }
  catch (e) { toast(e.message, true); }
}

function editGuard() {

  const ae = document.activeElement;
  return ae && (ae.closest("#services") || ae.closest("#projects") || ae.id === "filter") &&
         ["SELECT","INPUT","TEXTAREA"].includes(ae.tagName);

let prevUp = null; // name -> was running (crash detection across polls)
function notifyCrash(name, code) {
  toast(`${name} crashed (exit ${code})`, true);
  if (!("Notification" in window)) return;
  if (Notification.permission === "default") Notification.requestPermission();
  if (Notification.permission === "granted")
    new Notification("Stackdeck", { body: `${name} crashed (exit code ${code})` });
}
async function loadServices(force) {
  if (!force && editGuard()) return;
  try {
    const d = await api("/api/services");
    groups = d.groups || []; services = d.services || [];
    instancesList = d.instances || [];
    hiddenGroups = d.hiddenGroups || []; hiddenCategories = d.hiddenCategories || [];
    if (prevUp) for (const s of services) {
      if (prevUp.get(s.name) && !s.running && s.lastExit && !s.lastExit.expected && s.lastExit.code !== 0)
        notifyCrash(s.name, s.lastExit.code);
    }
    prevUp = new Map(services.map(s => [s.name, s.running]));
    renderServices();
  }
  catch (e) { toast("Stackdeck server unreachable: " + e.message, true); }
}
/* ---------- dev tools (infra) ---------- */

let infra = [];
async function loadInfra() {
  try { infra = await api("/api/infra"); renderInfra(); } catch {}
}
function renderInfra() {
  document.getElementById("infra-count").textContent = `${infra.length} detected on this machine`;
  document.getElementById("infra").innerHTML = infra.length ? infra.map(t => `
    <div class="row">
      <div class="row-main">
        <span class="dot ${t.runningPid ? "up" : ""}"></span>
        <span class="svc-name" style="min-width:140px">${esc(t.title)}</span>
        <span class="addr">:${t.port}${t.runningPid ? " · " + t.runningPid : ""}</span>
        <span class="grow cmdline"><b>${esc(t.command)}</b></span>
        ${t.configured
          ? '<span class="badge cfgd">configured</span>'
          : `<button class="add" onclick="configureInfra('${esc(t.name)}')">configure</button>`}
      </div>
    </div>`).join("")
    : '<div class="empty">No known databases or brokers found on PATH.</div>';
}
async function configureInfra(name) {
  const t = infra.find(x => x.name === name);
  if (!t) return;
  try {
    if (!groups.includes("Infra")) await api("/api/group", { name: "Infra" }).catch(() => {});
    // envFile:false — a database must not inherit some random ~/.env
    await api("/api/service", { name: t.name, dir: "~", command: t.command, port: t.port, envFile: false, group: "Infra" });
    toast(`${t.title} added to Services (Infra section)`);
    await load(); loadInfra();
  } catch (e) { toast(e.message, true); }
}

async function loadProjects(fresh) {
  try { projects = await api("/api/projects" + (fresh ? "?fresh" : "")); renderProjects(); } catch {}
}
async function refreshProjects() {
  const before = projects.length;
  await loadProjects(true);
  const diff = projects.length - before;
  toast(diff > 0 ? `rescanned — ${diff} new project${diff > 1 ? "s" : ""} found`
      : diff < 0 ? `rescanned — ${-diff} project${diff < -1 ? "s" : ""} gone`
      : "rescanned — no changes");
}

/* ---------- settings (VLC-style folder tree) ---------- */

let meta = null;
const pending = { roots: [], excludes: new Set(), openRoots: new Set() };

function toggleSettings() {
  const el = document.getElementById("settings");
  const show = el.style.display === "none";
  el.style.display = show ? "" : "none";
  if (show && meta) {
    pending.roots = [...meta.projectRoots];
    pending.excludes = new Set(meta.excludes || []);
    pending.openRoots = new Set(pending.roots); // expanded by default, like VLC
    // Ordered category list: saved order first, then any others alphabetically.
    const existing = [...new Set(projects.map(p => p.category || "Uncategorized"))].filter(c => c !== "Uncategorized");
    pending.cats = [
      ...(meta.categoryOrder || []).filter(c => existing.includes(c)),
      ...existing.filter(c => !(meta.categoryOrder || []).includes(c)).sort(),
    ];
    document.getElementById("cfg-path").textContent = "saved to " + shortP(meta.configPath);
    document.getElementById("cfg-browser").style.display = "none";
    renderRoots();
    renderCatList();
  }
}

/* category reorder list */
let dragCat = null;
function renderCatList() {
  const counts = {};
  for (const p of projects) counts[p.category || "Uncategorized"] = (counts[p.category || "Uncategorized"] || 0) + 1;
  document.getElementById("cfg-cats").innerHTML = pending.cats.map((c, i) => `
    <div class="cat-row" draggable="true" data-i="${i}"
         ondragstart="dragCat=${i}; this.classList.add('dragging')"
         ondragend="dragCat=null; document.querySelectorAll('.cat-row').forEach(e=>e.classList.remove('dragging','drop-before'))"
         ondragover="event.preventDefault(); if(dragCat!==null && dragCat!=${i}) this.classList.add('drop-before')"
         ondragleave="this.classList.remove('drop-before')"
         ondrop="dropCat(event, ${i})">
      <span class="handle">⠿</span> ${esc(c)} <span class="count">${counts[c] || 0}</span>
    </div>`).join("") +
    `<div class="cat-row pinned" title="new and unmapped projects land here">Uncategorized — always last <span class="count">${counts["Uncategorized"] || 0}</span></div>`;
}
function dropCat(ev, to) {
  ev.preventDefault();
  if (dragCat === null || dragCat === to) return;
  const [moved] = pending.cats.splice(dragCat, 1);
  pending.cats.splice(to > dragCat ? to - 1 : to, 0, moved);
  dragCat = null;
  renderCatList();
}

async function renderRoots() {
  const box = document.getElementById("cfg-roots-list");
  const blocks = await Promise.all(pending.roots.map(async (root) => {
    const rArg = `decodeURIComponent('${encodeURIComponent(root)}')`;
    const isOpen = pending.openRoots.has(root);
    let children = "";
    if (isOpen) {
      try {
        const fsList = await api("/api/fs?path=" + encodeURIComponent(root));
        children = `<div class="child-grid">` + fsList.dirs.map(d => {
          const full = (fsList.path.endsWith("/") ? fsList.path : fsList.path + "/") + d;
          const off = pending.excludes.has(full);
          const fArg = `decodeURIComponent('${encodeURIComponent(full)}')`;
          return `<label class="${off ? "off" : ""}">
            <input type="checkbox" ${off ? "" : "checked"} onchange="toggleExclude(${fArg}, this.checked)"> ${esc(d)}
          </label>`;
        }).join("") + `</div>`;
      } catch (e) { children = `<div class="child-grid"><span class="cmdline">${esc(e.message)}</span></div>`; }
    }
    return `<div class="root-row">
        <span class="chev ${isOpen ? "" : "closed"}" onclick="toggleRootOpen(${rArg})">▾</span>
        <b>${esc(shortP(root))}</b>
        <button class="ghost" onclick="removeRoot(${rArg})">remove</button>
      </div>${children}`;
  }));
  box.innerHTML = blocks.join("") ||
    '<div class="cmdline" style="padding:6px 0">no folders yet — add one below</div>';
}

function toggleRootOpen(root) {
  pending.openRoots.has(root) ? pending.openRoots.delete(root) : pending.openRoots.add(root);
  renderRoots();
}
function toggleExclude(full, included) {
  included ? pending.excludes.delete(full) : pending.excludes.add(full);
  renderRoots();
}
function removeRoot(root) {
  pending.roots = pending.roots.filter(r => r !== root);
  renderRoots();
}

/* folder browser for adding a root */
let browsePath = null;
async function browseFolders(p) {
  const box = document.getElementById("cfg-browser");
  box.style.display = "";
  try {
    const d = await api("/api/fs?path=" + encodeURIComponent(p || browsePath || "~"));
    browsePath = d.path;
    const up = `decodeURIComponent('${encodeURIComponent(d.parent)}')`;
    box.innerHTML = `<div class="browser">
      <div class="crumb">${esc(shortP(d.path))}</div>
      <div class="dirs">
        <button onclick="browseFolders(${up})">⬑ ..</button>
        ${d.dirs.map(n => {
          const full = `decodeURIComponent('${encodeURIComponent((d.path.endsWith("/") ? d.path : d.path + "/") + n)}')`;
          return `<button onclick="browseFolders(${full})">${esc(n)}/</button>`;
        }).join("")}
      </div>
      <div style="display:flex; gap:8px; margin-top:10px">
        <button class="add" onclick="pickRoot()">scan this folder</button>
        <button class="ghost" onclick="document.getElementById('cfg-browser').style.display='none'">cancel</button>
      </div>
    </div>`;
  } catch (e) { toast(e.message, true); }
}
function pickRoot() {
  if (browsePath && !pending.roots.includes(browsePath)) {
    pending.roots.push(browsePath);
    pending.openRoots.add(browsePath);
  }
  document.getElementById("cfg-browser").style.display = "none";
  renderRoots();
}

async function saveConfig() {
  try {
    await api("/api/config", {
      projectRoots: pending.roots,
      excludes: [...pending.excludes],
      categoryOrder: pending.cats,
    });
    toast("settings saved");
    document.getElementById("settings").style.display = "none";
    await loadMeta();
    await loadProjects(true);
  } catch (e) { toast(e.message, true); }
}
async function load() { await Promise.all([loadServices(), loadProjects()]); }
async function loadMeta() {
  try {
    const m = await api("/api/meta");
    meta = m;
    if (m.categoryOrder && m.categoryOrder.length) CAT_ORDER = [...m.categoryOrder, "Uncategorized"];
    document.getElementById("metaPaths").textContent = `v${m.version}`;
    document.getElementById("metaPaths").title = `config: ${shortP(m.configPath)} · logs: ${shortP(m.logDir)}`;
    document.getElementById("filter").placeholder =
      `filter ${m.projectRoots.map(shortP).join(", ")}…`;
    renderProjects();
  } catch {}
}

load(); loadMeta(); loadInfra();
setInterval(() => { if (document.visibilityState === "visible") loadInfra(); }, 15000);
setInterval(() => { if (document.visibilityState === "visible") loadServices(); }, 5000);
setInterval(() => { if (document.visibilityState === "visible" && !editGuard()) loadProjects(); }, 60000);
</script>
