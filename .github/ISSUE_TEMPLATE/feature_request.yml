name: Feature request
description: Suggest something Stackdeck should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write this: Stackdeck has zero dependencies
        and keeps `server.js` and `index.html` as single readable files. Both
        are load-bearing, not incidental — see CONTRIBUTING.md.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem
      description: The situation you're in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead
      description: |
        The most useful field here. Whatever you currently do — a terminal
        command, another tool, giving up — tells me how much this actually
        costs you and what the feature has to beat.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like it to do
    validations:
      required: false
